name: tokio_seguros
description: "App de seguros (mobile + web) — desafio técnico Flutter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter_bloc: ^9.1.1
  flutter_modular: ^7.1.1
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^3.1.20
  mask_text_input_formatter: ^2.9.0
  result_dart: ^2.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  web: ^1.1.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
